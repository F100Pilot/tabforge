[project]
name = "tabforge-api"
version = "0.1.0"
description = "TabForge HTTP API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.3,<4",
  "boto3>=1.43,<2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabforge_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs Postgres at TABFORGE_TEST_DATABASE_URL (skipped when unset)",
  "s3: needs an S3 API at TABFORGE_TEST_S3_ENDPOINT (skipped when unset)",
]
