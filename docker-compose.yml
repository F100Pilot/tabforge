# Local development only. Credentials are dev defaults read from .env (see .env.example).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tabforge}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tabforge}"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for dev (ADR-0004; MinIO no longer ships images on Docker Hub).
  s3:
    image: versity/versitygw:v1.9.0
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-tabforge}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
    ports: ["127.0.0.1:7070:7070"]
    volumes: [s3data:/data]

  # One-shot: apply migrations and create the bucket (with CORS for the web origin).
  migrate:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && python -m tabforge_api.cli init-storage"]
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  s3data:
