name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm audit --audit-level high

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [services/api, services/worker, packages/score]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tabforge
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tabforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tabforge -d tabforge_test" --health-interval 5s --health-retries 10
      s3:
        image: versity/versitygw:v1.9.0
        env:
          ROOT_ACCESS_KEY: tabforge
          ROOT_SECRET_KEY: tabforge-dev-secret
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
        ports: ["7070:7070"]
        options: --tmpfs /data
    env:
      TABFORGE_TEST_DATABASE_URL: postgresql://tabforge:ci-only@localhost:5432/tabforge_test
      TABFORGE_TEST_S3_ENDPOINT: http://localhost:7070
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests $(test -d eval && echo eval) $(test -d migrations && echo migrations)
      - name: Migrations match the models
        if: matrix.project == 'services/api'
        env:
          TABFORGE_DATABASE_URL: ${{ env.TABFORGE_TEST_DATABASE_URL }}
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q
      - name: Dependency audit (incl. ML extras)
        run: |
          # Our own path package (packages/score) is not on PyPI; its dependencies are still audited.
          uv export --frozen --all-extras --no-hashes --no-emit-project --no-emit-package tabforge-score > "$RUNNER_TEMP/req.txt"
          uvx pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/req.txt"

  docker:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t tabforge-api .
      - run: docker build -f services/worker/Dockerfile -t tabforge-worker .
      - name: Worker image loads its models offline
        run: >-
          docker run --rm --network none tabforge-worker python -c
          "from demucs.pretrained import get_model; get_model('htdemucs_6s');
          from tabforge_worker.adapters.basic_pitch import BasicPitchOnnxTranscriber;
          BasicPitchOnnxTranscriber(); print('models ok')"
      - name: Compose file is valid
        run: cp .env.example .env && docker compose config -q
