name: Desktop (Windows)

# Smoke-test start.bat, the way TabForge is run on the PC (it prepares the bundle itself: Python
# env, downloads, Demucs weights, web build), only when what the launcher installs or runs
# changes (ADR-0015): the desktop app, start.bat or a Python dependency. Building and
# smoke-testing TabForge.exe and TabForge-Setup.exe only on demand ("Run workflow"), since
# nobody installs it for now (ADR-0012). "Run workflow" also forces the smoke test.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "start.bat"
      - "services/*/pyproject.toml"
      - "services/*/uv.lock"
      - "packages/*/pyproject.toml"
      - "packages/*/uv.lock"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "start.bat"
      - "services/*/pyproject.toml"
      - "services/*/uv.lock"
      - "packages/*/pyproject.toml"
      - "packages/*/uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONUTF8: "1"
      PACKAGE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Smoke test from source (start.bat, as used for local testing)
        shell: cmd
        run: |
          set TABFORGE_DATA_DIR=%RUNNER_TEMP%\tabforge-src-data
          call start.bat --smoke
          if errorlevel 1 (
            for %%f in ("%TABFORGE_DATA_DIR%\logs\*.log") do (
              echo === %%~nxf ===
              type "%%f"
            )
            exit /b 1
          )
          findstr /c:"smoke_ok" "%TABFORGE_DATA_DIR%\logs\tabforge.log"

      - name: PyInstaller
        if: env.PACKAGE == 'true'
        working-directory: apps/desktop
        # start.bat syncs without the build group (uv sync removes PyInstaller): restore it here.
        run: uv run --frozen --extra bundle --group build pyinstaller packaging/tabforge.spec --noconfirm

      - name: Smoke test (packaged app, real CPU pipeline, no window)
        if: env.PACKAGE == 'true'
        working-directory: apps/desktop
        run: |
          $env:TABFORGE_DATA_DIR = "$env:RUNNER_TEMP\tabforge-data"
          $p = Start-Process -FilePath dist\TabForge\TabForge.exe -ArgumentList "--smoke" -Wait -PassThru
          Get-ChildItem "$env:TABFORGE_DATA_DIR\logs" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.Name) ==="; Get-Content $_.FullName -Tail 80
          }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:TABFORGE_DATA_DIR\logs\tabforge.log" -Pattern "smoke_ok" -Quiet)) {
            throw "smoke_ok not logged"
          }

      - name: Installer (Inno Setup)
        if: env.PACKAGE == 'true'
        working-directory: apps/desktop
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer.iss
          Get-Item dist\TabForge-Setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        if: env.PACKAGE == 'true'
        with:
          name: TabForge-Setup
          path: apps/desktop/dist/TabForge-Setup.exe
          retention-days: 14
